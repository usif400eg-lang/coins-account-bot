<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>تسجيل الدخول — RODRIGO HUB</title>
    <meta name="theme-color" content="#07071a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            background: #060613;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Circles in Background */
        .ambient-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            pointer-events: none;
            filter: blur(50px);
            animation: pulseGlow 7s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            pointer-events: none;
            filter: blur(50px);
            animation: pulseGlow 9s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(13, 13, 33, 0.88);
            border: 1px solid rgba(124, 58, 237, 0.28);
            border-radius: 24px;
            padding: 44px 34px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(124, 58, 237, 0.15);
            position: relative;
            z-index: 10;
            overflow: hidden;
            animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a855f7, #06b6d4, transparent);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
        }

        .login-icon {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            color: #fff;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.5), inset 0 0 10px rgba(255,255,255,0.2);
            margin: 0 auto;
        }

        .login-header h1 {
            font-size: 1.7rem;
            font-weight: 900;
            color: #f1f5f9;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .login-header p {
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 13px 18px;
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: shake 0.35s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(6px); }
            40%, 80% { transform: translateX(-6px); }
        }

        .form-group-custom {
            margin-bottom: 24px;
            text-align: right;
        }

        .form-group-custom label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .password-field-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .field-icon-right {
            position: absolute;
            right: 16px;
            color: #7c3aed;
            font-size: 1rem;
            pointer-events: none;
            z-index: 2;
        }

        .custom-password-input {
            width: 100% !important;
            min-height: 52px !important;
            background: #0a0a22 !important;
            border: 1.5px solid rgba(124, 58, 237, 0.3) !important;
            border-radius: 14px !important;
            padding: 14px 46px 14px 46px !important;
            color: #ffffff !important;
            font-size: 1rem !important;
            font-family: inherit !important;
            outline: none !important;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4) !important;
            transition: all 0.25s ease !important;
        }

        .custom-password-input:focus {
            border-color: #a855f7 !important;
            background: #0d0d2b !important;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25), 0 0 20px rgba(124, 58, 237, 0.35) !important;
        }

        .custom-password-input::placeholder {
            color: #475569;
            letter-spacing: 2px;
        }

        .toggle-password-btn {
            position: absolute;
            left: 14px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.15s;
            z-index: 2;
        }

        .toggle-password-btn:hover {
            color: #22d3ee;
            transform: scale(1.1);
        }

        .btn-login {
            width: 100%;
            min-height: 52px;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.4);
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer-text {
            margin-top: 28px;
            text-align: center;
            font-size: 0.76rem;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .login-footer-text span {
            color: #22d3ee;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-icon-wrap">
                <div class="login-icon">⚡</div>
            </div>
            <h1>لوحة الإدارة</h1>
            <p>سجّل الدخول للوصول إلى لوحة التحكم والطلبات</p>
        </div>

        {% if error %}
        <div class="error-alert">
            <i class="fa-solid fa-circle-exclamation" style="color: #ef4444; font-size: 1.1rem;"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" autocomplete="off">
            <div class="form-group-custom">
                <label for="admin_pwd">
                    <i class="fa-solid fa-shield-halved" style="color: #06b6d4;"></i>
                    كلمة مرور الإدارة (Admin Password)
                </label>
                <div class="password-field-container">
                    <i class="fa-solid fa-lock field-icon-right"></i>
                    <input type="password" 
                           name="password" 
                           id="admin_pwd" 
                           class="custom-password-input"
                           placeholder="••••••••" 
                           required 
                           autofocus>
                    <button type="button" 
                            class="toggle-password-btn" 
                            id="toggleBtn" 
                            onclick="togglePasswordVisibility()" 
                            aria-label="إظهار / إخفاء كلمة المرور">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginSubmitBtn">
                <i class="fa-solid fa-right-to-bracket"></i>
                دخول إلى لوحة التحكم
            </button>
        </form>

        <div class="login-footer-text">
            <span>RODRIGO HUB</span> · eFootball Shop Dashboard v2.5
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById("admin_pwd");
            const icon = document.getElementById("eyeIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
                icon.style.color = "#22d3ee";
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
                icon.style.color = "#64748b";
            }
            input.focus();
        }

        // Add spinner on submit
        const form = document.querySelector('form');
        const submitBtn = document.getElementById('loginSubmitBtn');
        form.addEventListener('submit', () => {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';
        });
    </script>
</body>
</html>
